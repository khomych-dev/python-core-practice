name: Run Tests

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: garage_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system ruff mypy pytest pytest-asyncio httpx

      - name: Run Linters
        run: |
          ruff check .
          ruff format --check .
          mypy .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/garage_test_db
          DATABASE_URL_TEST: postgresql+asyncpg://user:password@localhost:5432/garage_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: "ci_test_secret_key"
          OPENAI_API_KEY: "sk-dummy-test-key-for-github-actions"
          LANGFUSE_PUBLIC_KEY: "pk-lf-dummy-key"
          LANGFUSE_SECRET_KEY: "sk-lf-dummy-key"
          LANGFUSE_HOST: "https://cloud.langfuse.com"
        run: pytest -v
