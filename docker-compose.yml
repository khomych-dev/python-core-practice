services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: garage_admin
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: garage_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://garage_admin:super_secret_password@db:5432/garage_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://garage_admin:super_secret_password@db:5432/garage_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: ["python", "-m", "arq", "worker.WorkerSettings"]
    volumes:
      - ./invoices:/app/invoices

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    restart: always

volumes:
  postgres_data:
